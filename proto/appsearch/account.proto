syntax = "proto2";

package appsearch;

option java_package = "com.google.android.appsearch.proto";
option java_multiple_files = true;
option objc_class_prefix = "APPSEARCH";

// The proto to reprent an AppSearchAccount object
// Next tag: 6
message AccountProto {
  // The namespace the account document belongs to .
  optional string namespace = 1;
  // The unique identifier for the document within the namespace.
  optional string id = 2;
  // The type of the account. This corresponds to android.accounts.Account.type.
  optional string account_type = 3;
  // The name of the account. This corresponds to android.accounts.Account.name.
  optional string account_name = 4;
  // An opaque, optional identifier for the account, like gaia id.
  optional string account_id = 5;
}
